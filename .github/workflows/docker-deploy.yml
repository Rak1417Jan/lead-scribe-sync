name: Multi-Environment Deploy to Google Cloud

on:
  push:
    branches: [ prod, staging, dev ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: asia-south1
  SERVICE_BASE_NAME: call-scheduler

jobs:
  # Determine environment based on branch
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      service_name: ${{ steps.set-env.outputs.service_name }}
      domain_suffix: ${{ steps.set-env.outputs.domain_suffix }}
      mongodb_suffix: ${{ steps.set-env.outputs.mongodb_suffix }}
    steps:
      - name: Set Environment Variables
        id: set-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/prod" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "service_name=call-scheduler-prod" >> $GITHUB_OUTPUT
            echo "domain_suffix=prod" >> $GITHUB_OUTPUT
            echo "mongodb_suffix=callScheduler-prod" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "service_name=call-scheduler-staging" >> $GITHUB_OUTPUT
            echo "domain_suffix=staging" >> $GITHUB_OUTPUT
            echo "mongodb_suffix=callScheduler-staging" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "service_name=call-scheduler-dev" >> $GITHUB_OUTPUT
            echo "domain_suffix=dev" >> $GITHUB_OUTPUT
            echo "mongodb_suffix=callScheduler-dev" >> $GITHUB_OUTPUT
          else
            echo "environment=review" >> $GITHUB_OUTPUT
            echo "service_name=call-scheduler-pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
            echo "domain_suffix=review" >> $GITHUB_OUTPUT
            echo "mongodb_suffix=callScheduler-dev" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: setup
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Environment Variables
        run: |
          echo "ENVIRONMENT=${{ needs.setup.outputs.environment }}" >> $GITHUB_ENV
          echo "SERVICE_NAME=${{ needs.setup.outputs.service_name }}" >> $GITHUB_ENV
          echo "DOMAIN_SUFFIX=${{ needs.setup.outputs.domain_suffix }}" >> $GITHUB_ENV
          echo "MONGODB_SUFFIX=${{ needs.setup.outputs.mongodb_suffix }}" >> $GITHUB_ENV

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Docker Auth
        id: docker-auth
        uses: 'docker/login-action@v3'
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Build and Push Container
        run: |-
          IMAGE_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE_BASE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" ./
          docker push "$IMAGE_TAG"
          
          # Also tag with environment for easy reference
          ENV_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE_BASE_NAME }}/${{ env.SERVICE_NAME }}:${{ env.ENVIRONMENT }}-latest"
          docker tag "$IMAGE_TAG" "$ENV_TAG"
          docker push "$ENV_TAG"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GAR_LOCATION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE_BASE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          env_vars: |
            NODE_ENV=${{ env.ENVIRONMENT }}
            ENVIRONMENT=${{ env.ENVIRONMENT }}
            MONGODB_SUFFIX=${{ env.MONGODB_SUFFIX }}
            EXOTEL_APP_ID=967234
            EXOTEL_CALL_CONFIG_URL=http://my.exotel.com/stellarframes1/exoml/start_voice/967234
            EXOTEL_TIME_LIMIT=1200
            EXOTEL_CALL_TYPE=trans
            CRM_SERVICE_API_URL=https://crm.lexipitch.com/api/crm/connect
            DISPATCHER_SERVICE_URL=http://localhost:3006/api/dispatch
          secrets: |
            MONGODB_URI=MONGODB_URI:latest
            DEMO_MONGODB_URI=DEMO_MONGODB_URI:latest
            DEMO_MONGODB_CALL=DEMO_MONGODB_CALL:latest
            EXOTEL_API_KEY=EXOTEL_API_KEY:latest
            EXOTEL_API_TOKEN=EXOTEL_API_TOKEN:latest
          flags: |
            --allow-unauthenticated
            --memory=512Mi
            --cpu=1
            --max-instances=10
            --min-instances=0

      - name: Show Deployment Info
        run: |
          echo "🚀 Deployed to: ${{ steps.deploy.outputs.url }}"
          echo "📦 Environment: ${{ env.ENVIRONMENT }}"
          echo "🏷️  Service: ${{ env.SERVICE_NAME }}"
          echo "🗄️  Database: ${{ env.MONGODB_SUFFIX }}"
